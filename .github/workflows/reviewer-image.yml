name: Reviewer image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reviewer-image.yml
      - packages/reviewer/docker/**
      # The server bundle traverses workspace imports; do not maintain a second dependency graph.
      - packages/*/src/**
      - packages/*/package.json
      - packages/*/tsconfig*.json
      - apps/web/package.json
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: reviewer-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/reviewer/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dzhng/factory-reviewer:main
            ghcr.io/dzhng/factory-reviewer:${{ github.sha }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/dzhng/factory-reviewer
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Record immutable reviewer reference
        run: echo 'Use `ghcr.io/dzhng/factory-reviewer@${{ steps.build.outputs.digest }}`.' >> "$GITHUB_STEP_SUMMARY"
